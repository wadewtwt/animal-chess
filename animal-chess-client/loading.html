<!DOCTYPE html>
<html lang="zh-CN" class="notranslate" translate="no">
<head>
    <meta charset="utf-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' data: blob:; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'">
    <title>Jungle Strategy - Loading</title>
    <style>
        :root {
            --bg: #fffadf;
            --panel: #f6f0bb;
            --panel-strong: #e9df8a;
            --primary: #006e1c;
            --primary-2: #4caf50;
            --accent: #f9e534;
            --text: #1e1c00;
            --subtext: #3f4a3c;
            --shadow: rgba(0, 0, 0, 0.14);
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            overflow: hidden;
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 20% 18%, rgba(255, 255, 255, 0.75), transparent 24%),
                radial-gradient(circle at 80% 10%, rgba(255, 234, 135, 0.55), transparent 22%),
                url('./assets/resources/textures/loading_bg.png') no-repeat center center;
            background-size: cover;
        }

        .scene {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px;
        }

        .scene::before,
        .scene::after {
            content: "";
            position: absolute;
            inset: auto;
            border-radius: 999px;
            background: radial-gradient(circle, rgba(76, 175, 80, 0.18), rgba(76, 175, 80, 0) 70%);
            filter: blur(4px);
            pointer-events: none;
        }

        .scene::before {
            width: 420px;
            height: 420px;
            top: -110px;
            left: -120px;
        }

        .scene::after {
            width: 520px;
            height: 520px;
            bottom: -180px;
            right: -140px;
        }

        .card {
            position: relative;
            width: min(620px, 100%);
            min-height: min(860px, 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 28px 24px 30px;
            border: 1px solid rgba(255, 255, 255, 0.68);
            border-radius: 32px;
            background: rgba(255, 251, 228, 0.72);
            backdrop-filter: blur(12px);
            box-shadow: 0 28px 80px rgba(76, 96, 24, 0.16);
            overflow: hidden;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 50% 16%, rgba(255, 255, 255, 0.55), transparent 22%),
                linear-gradient(135deg, rgba(255, 255, 255, 0.18), transparent 42%);
            pointer-events: none;
        }

        .header {
            position: relative;
            text-align: center;
            padding-top: 8px;
        }

        .title {
            margin: 0;
            font-size: clamp(34px, 6vw, 44px);
            line-height: 1.08;
            letter-spacing: -0.03em;
            color: var(--primary);
            text-shadow: 0 2px 0 rgba(255, 255, 255, 0.65);
        }

        .subtitle {
            margin: 10px 0 0;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            color: rgba(63, 74, 60, 0.82);
        }

        .hero-wrap {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            min-height: 320px;
        }

        .hero-float {
            animation: float 4s ease-in-out infinite;
        }

        .hero-badge {
            width: min(270px, 54vw);
            aspect-ratio: 1;
            border-radius: 34px;
            border: 4px solid rgba(255, 255, 255, 0.85);
            background:
                radial-gradient(circle at 35% 28%, rgba(255, 255, 255, 0.8), transparent 22%),
                linear-gradient(180deg, #ffde7a 0%, #f2b740 100%);
            box-shadow: 0 12px 0 rgba(0, 0, 0, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: clamp(72px, 14vw, 104px);
            user-select: none;
            cursor: pointer;
            transition: transform 120ms ease, box-shadow 120ms ease;
        }

        .hero-badge:active {
            transform: translateY(4px);
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.12);
        }

        .loading-block {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 22px;
            align-items: center;
            justify-content: center;
            padding-bottom: 6px;
        }

        .status-line {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-align: center;
            color: var(--text);
        }

        .spinner {
            width: 38px;
            height: 38px;
            border-radius: 999px;
            border: 4px solid rgba(0, 110, 28, 0.12);
            border-top-color: var(--primary);
            animation: spin 1s linear infinite;
            flex: none;
        }

        .status-text {
            margin: 0;
            font-size: clamp(24px, 4.2vw, 38px);
            line-height: 1.25;
            font-weight: 800;
        }

        .progress-shell {
            position: relative;
            width: 100%;
        }

        .progress-track {
            position: relative;
            width: 100%;
            height: 72px;
            padding: 8px;
            border-radius: 999px;
            border: 8px solid rgba(63, 74, 60, 0.14);
            background: var(--panel);
            box-shadow: inset 0 4px 6px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .progress-fill {
            position: relative;
            width: 0%;
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--primary), var(--primary-2));
            overflow: hidden;
            transition: width 500ms ease;
        }

        .progress-shine {
            position: absolute;
            inset: 0;
            width: 50%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            animation: shine 2s infinite;
        }

        .progress-badge {
            position: absolute;
            top: -104px;
            left: 0%;
            transform: translateX(-50%);
            padding: 12px 28px 16px;
            border-radius: 24px;
            background: var(--accent);
            box-shadow: 0 8px 0 var(--shadow);
            font-size: 38px;
            line-height: 1;
            font-weight: 800;
            color: #201c00;
            transition: left 500ms ease;
        }

        .progress-badge::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: -18px;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 20px solid var(--accent);
        }

        .tip {
            margin: 0;
            text-align: center;
            color: rgba(63, 74, 60, 0.86);
            font-size: clamp(16px, 2.8vw, 22px);
            line-height: 1.5;
            font-style: italic;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-14px) rotate(2deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes shine {
            0% { transform: translateX(-120%); }
            100% { transform: translateX(240%); }
        }

        @media (max-width: 520px) {
            .card {
                min-height: auto;
                padding: 22px 18px 22px;
                border-radius: 26px;
            }

            .scene {
                padding: 14px;
            }

            .hero-wrap {
                min-height: 240px;
            }

            .progress-track {
                height: 64px;
            }

            .progress-badge {
                top: -92px;
                padding: 10px 22px 14px;
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
    <main class="scene">
        <section class="card" aria-label="Loading screen">
            <header class="header">
                <h1 class="title">Jungle Strategy</h1>
                <p class="subtitle">Adventure Awaits</p>
            </header>

            <div class="hero-wrap">
                <div class="hero-float">
                    <div class="hero-badge" id="hero-badge" aria-hidden="true">🐾</div>
                </div>
            </div>

            <section class="loading-block" aria-live="polite">
                <div class="status-line">
                    <div class="spinner" aria-hidden="true"></div>
                    <p class="status-text">正在探索丛林中...</p>
                </div>

                <div class="progress-shell">
                    <div class="progress-track">
                        <div class="progress-fill" id="loading-bar">
                            <div class="progress-shine"></div>
                        </div>
                    </div>

                    <div class="progress-badge" id="progress-badge">
                        <span id="progress-text">0%</span>
                    </div>
                </div>

                <p class="tip">提示：别忘了给你的英雄装备“香蕉镖”！</p>
            </section>
        </section>
    </main>

    <script>
        const progressBar = document.getElementById('loading-bar');
        const progressText = document.getElementById('progress-text');
        const progressBadge = document.getElementById('progress-badge');
        const heroBadge = document.getElementById('hero-badge');
        let progress = 0;

        const updateLoading = () => {
            if (progress < 100) {
                progress += Math.random() * 2;
                if (progress > 100) progress = 100;

                progressBar.style.width = `${progress}%`;
                progressText.innerText = `${Math.floor(progress)}%`;
                progressBadge.style.left = `${progress}%`;
            } else {
                heroBadge.style.animation = 'none';
                heroBadge.animate(
                    [
                        { transform: 'translateY(0) scale(1)' },
                        { transform: 'translateY(-10px) scale(1.04)' },
                        { transform: 'translateY(0) scale(1)' }
                    ],
                    { duration: 550, iterations: 2 }
                );
                setTimeout(() => {
                    progress = 0;
                    progressBar.style.width = '0%';
                    progressText.innerText = '0%';
                    progressBadge.style.left = '0%';
                    heroBadge.style.animation = 'float 4s ease-in-out infinite';
                }, 1800);
            }
        };

        setInterval(updateLoading, 150);
    </script>
</body>
</html>
