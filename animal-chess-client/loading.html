    <style>
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        @keyframes shine {
            0% { left: -100%; }
            100% { left: 100%; }
        }
        .bouncy-hero {
            animation: float 4s ease-in-out infinite;
        }
        .progress-shine {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: shine 2s infinite;
        }
        .3d-shadow {
            box-shadow: 0 8px 0 0 rgba(0,0,0,0.1);
        }
        .text-shadow-soft {
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
    </style>

<body class="bg-background text-on-background font-body-md overflow-hidden h-screen w-screen flex flex-col items-center justify-center">

    <!-- Lush Jungle Background Wrapper -->
    <div class="fixed inset-0 z-0">
        <img alt="Lush Jungle Background" class="w-full h-full object-cover scale-110" data-alt="A lush, vibrant jungle landscape in a soft-focus modern cartoon style. The scene is filled with oversized tropical leaves in varying shades of emerald and lime green, with golden sunlight filtering through the canopy. The atmosphere is warm, friendly, and magical, using the brand's signature cream and green palette. Every element feels soft and tactile, like a high-quality 3D animation background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAWsEh-HSWJ74Net4BcN8baDxmlTaowMurcXMFpfQBFQV2kmL86b9vIae_-XbMfwh8x9roKcJ3hdhxHVf04ffh6SGn937v_a6Zv0j2agDQh7jimTmGU-Uft0ppYpwLDLdP_rHvNYx7fmbgOyBabADm8ACkfNPnfffeUqq3u364tr7S6Z6x9udQGoIRE_IWJgHItiQgxB281HO9pQe3JDpjTYuIWZHqpue5WEtLgXvKpIRdDAyMXZ9KnPLMhInteECiBFtAVhwlFcyr8">
    </div>

    <!-- Main Content Canvas -->
    <main class="relative z-10 flex flex-col items-center justify-between h-full py-xl w-full max-w-md px-container-margin">
        <!-- Header Branding -->
        <div class="text-center pt-lg">
            <h1 class="font-headline-xl text-headline-xl-mobile text-primary text-shadow-soft tracking-tight">
                Jungle Strategy
            </h1>
            <p class="font-label-bold text-label-bold text-on-surface-variant uppercase tracking-widest mt-base">
                Adventure Awaits
            </p>
        </div>

        <!-- Central Character Illustration -->
        <div class="relative flex flex-col items-center justify-center flex-grow w-full bouncy-hero">
            <!-- Added missing character/unit badge based on the JavaScript references -->
            <div class="bg-tertiary-container w-32 h-32 rounded-3xl 3d-shadow flex items-center justify-center border-4 border-surface-bright cursor-pointer transition-transform duration-100 ease-in-out">
                <span class="material-symbols-outlined text-white" style="font-size: 80px; text-shadow: 0 4px 0 rgba(0,0,0,0.1);">pets</span>
            </div>
        </div>

        <!-- Bottom Loading Section -->
        <div class="w-full space-y-md pb-xl">
            <!-- Playful Status Text -->
            <div class="flex items-center justify-center space-x-sm">
                <span class="material-symbols-outlined text-primary animate-spin" style="font-size: 20px;">explore</span>
                <p class="font-headline-md text-headline-md text-on-surface text-center">
                    正在探索丛林中...
                </p>
            </div>

            <!-- Progress Container -->
            <div class="relative w-full">
                <!-- Outer Track (Inset appearance) -->
                <div class="h-10 w-full bg-surface-container-highest rounded-full p-xs shadow-[inset_0_4px_6px_rgba(0,0,0,0.1)] border-4 border-surface-variant">
                    <!-- Progress Fill -->
                    <div class="h-full bg-gradient-to-r from-primary to-primary-container rounded-full relative overflow-hidden transition-all duration-500 ease-out border-b-4 border-primary/30" id="loading-bar" style="width: 0%;">
                        <!-- Glow and Shine -->
                        <div class="progress-shine"></div>
                        <div class="absolute top-1 left-2 right-2 h-1 bg-white/20 rounded-full"></div>
                    </div>
                </div>

                <!-- Progress Percentage Badge -->
                <div class="absolute -top-10 left-[0%] -translate-x-1/2 bg-secondary-container text-on-secondary-fixed font-label-bold px-sm py-xs rounded-lg 3d-shadow transition-all duration-500 ease-out" id="progress-badge" style="left: 0%;">
                    <span id="progress-text">0%</span>
                    <div class="absolute -bottom-2 left-1/2 -translate-x-1/2 w-0 h-0 border-l-[6px] border-l-transparent border-r-[6px] border-r-transparent border-t-[8px] border-t-secondary-container"></div>
                </div>
            </div>

            <!-- Random Tip/Flavor Text -->
            <p class="text-center font-body-md text-on-surface-variant italic opacity-80 px-lg">
                提示：别忘了给你的英雄装备“香蕉镖”！
            </p>
        </div>
    </main>

    <script>
        // Simple progress simulation
        const progressBar = document.getElementById('loading-bar');
        const progressText = document.getElementById('progress-text');
        const progressBadge = document.getElementById('progress-badge'); // Fix: giving the badge an id for simpler targetting
        let progress = 0;

        const updateLoading = () => {
            if (progress < 100) {
                progress += Math.random() * 2;
                if (progress > 100) progress = 100;
                
                progressBar.style.width = `${progress}%`;
                progressText.innerText = `${Math.floor(progress)}%`;
                progressBadge.style.left = `${progress}%`;
            } else {
                // Shake character when done
                document.querySelector('.bouncy-hero').style.animation = 'none';
                document.querySelector('.bouncy-hero').classList.add('animate-bounce');
                setTimeout(() => {
                    progress = 0; // Loop for demo
                    document.querySelector('.bouncy-hero').classList.remove('animate-bounce');
                    document.querySelector('.bouncy-hero').style.animation = 'float 4s ease-in-out infinite';
                }, 2000);
            }
        };

        setInterval(updateLoading, 150);

        // Add "active" press effect for the unit portrait to show interaction feedback 
        // even though it's a loading screen
        const badge = document.querySelector('.bg-tertiary-container');
        if (badge) {
            badge.addEventListener('mousedown', () => {
                badge.style.transform = 'translateY(4px)';
                badge.style.boxShadow = 'none';
            });
            badge.addEventListener('mouseup', () => {
                badge.style.transform = 'translateY(0px)';
                badge.style.boxShadow = '0 8px 0 0 rgba(0,0,0,0.1)';
            });
            badge.addEventListener('mouseleave', () => {
                badge.style.transform = 'translateY(0px)';
                badge.style.boxShadow = '0 8px 0 0 rgba(0,0,0,0.1)';
            });
        }
    </script>
</body>
